name: "AgentGuard CI"
description: "Review AI-assisted Git metadata and enforce repository policy in pull requests and CI."
author: "BLCCoreStudio"

branding:
  icon: "shield"
  color: "orange"

inputs:
  path:
    description: "Checked-out repository path to scan."
    required: false
    default: "."
  revision:
    description: "Optional Git revision or range. Pull requests default to base..head when available."
    required: false
    default: ""
  policy:
    description: "Git metadata policy: privacy or clean."
    required: false
    default: "privacy"
  format:
    description: "Output format: text or json."
    required: false
    default: "text"

runs:
  using: "composite"
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.74.0

    - name: Run AgentGuard
      shell: bash
      env:
        AGENTGUARD_INPUT_PATH: ${{ inputs.path }}
        AGENTGUARD_INPUT_REVISION: ${{ inputs.revision }}
        AGENTGUARD_INPUT_POLICY: ${{ inputs.policy }}
        AGENTGUARD_INPUT_FORMAT: ${{ inputs.format }}
        AGENTGUARD_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        AGENTGUARD_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$GITHUB_ACTION_PATH/action-entrypoint.sh"
